<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passive voice: Subject and Object swap</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #f4efe4;
      font-family: Georgia, "Times New Roman", serif;
      color: #2c2418;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.25rem, 2.6vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    p.sub {
      margin: 0 0 20px;
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      color: #5a4f3d;
    }
    img {
      display: block;
      width: min(1200px, 96vw);
      height: auto;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(60, 40, 20, 0.18);
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Passive voice: Subject and Object swap</h1>
  <p class="sub">A dog bit me &nbsp;→&nbsp; I was bitten by a dog</p>
  <img src="S3-passive-SO-swap.gif" alt="Animation showing the subject and object swap when a sentence changes from active to passive: A dog bit me becomes I was bitten by a dog.">
</body>
</html>
